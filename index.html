<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Creepshow 2026 · Slideshow</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23641c10'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='42' fill='%23f0e2c5'%3EC%3C/text%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        --orange: #ff7500;
        --amber: #ffc46b;
        --ink: #080808;
        --paper: #e6d8bc;
        --display: Georgia, 'Times New Roman', serif;
        --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      :root { view-transition-name: none; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
      body { color: #fff; font-family: var(--sans); }
      button { font: inherit; }
      .app { position: fixed; inset: 0; background: #090909; isolation: isolate; }
      .app::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        opacity: .12;
        mix-blend-mode: screen;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
      }
      .slide {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: minmax(0, 1.06fr) minmax(420px, .94fr);
        opacity: 0;
        view-transition-name: cast-slide;
      }
      .slide.ready { opacity: 1; }
      ::view-transition-group(cast-slide) { animation-duration: .72s; animation-timing-function: cubic-bezier(.22,.61,.36,1); }
      ::view-transition-old(cast-slide) { animation: cast-slide-out .72s cubic-bezier(.22,.61,.36,1) both; }
      ::view-transition-new(cast-slide) { animation: cast-slide-in .72s cubic-bezier(.22,.61,.36,1) both; }
      @keyframes cast-slide-out {
        to { opacity: 0; filter: blur(12px); transform: scale(1.025); }
      }
      @keyframes cast-slide-in {
        from { opacity: 0; filter: blur(14px); transform: scale(.985); }
        to { opacity: 1; filter: blur(0); transform: scale(1); }
      }
      .slide.reverse .portrait { order: 2; }
      .slide.reverse .poster { order: 1; }
      .portrait { position: relative; overflow: hidden; background: #111; min-width: 0; }
      .portrait::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 62%, rgba(0,0,0,.42)),
          linear-gradient(0deg, rgba(0,0,0,.58), transparent 36%);
        pointer-events: none;
      }
      .reverse .portrait::after {
        background: linear-gradient(-90deg, transparent 62%, rgba(0,0,0,.42)),
          linear-gradient(0deg, rgba(0,0,0,.58), transparent 36%);
      }
      .portrait-bg, .portrait-main { position: absolute; inset: -3%; width: 106%; height: 106%; }
      .portrait-bg { object-fit: cover; filter: blur(42px) brightness(.33) saturate(.82); transform: scale(1.16); }
      .portrait-main {
        object-fit: contain;
        object-position: center 40%;
        filter: contrast(1.04) saturate(.94);
        animation: drift 11s ease-in-out both;
      }
      @keyframes drift { from { transform: scale(1.015); } to { transform: scale(1.06) translateY(-.5%); } }
      .portrait-initials {
        position: absolute;
        z-index: 2;
        top: clamp(28px, 4vw, 64px);
        right: clamp(28px, 4vw, 64px);
        display: none;
        color: rgba(255,255,255,.34);
        font-family: var(--display);
        font-size: clamp(72px, 11vw, 176px);
        font-weight: 900;
        line-height: .8;
        letter-spacing: -.06em;
        text-shadow: 0 4px 28px rgba(0,0,0,.72);
      }
      .slide.is-placeholder .portrait-initials { display: block; }
      .cast-label {
        position: absolute;
        z-index: 3;
        left: clamp(28px, 4vw, 72px);
        right: clamp(28px, 4vw, 72px);
        bottom: clamp(54px, 8vh, 104px);
      }
      .reverse .cast-label { text-align: right; }
      .eyebrow { color: var(--amber); font-size: clamp(10px, .8vw, 13px); font-weight: 800; letter-spacing: .34em; text-transform: uppercase; }
      .name {
        margin-top: 10px;
        font-family: var(--display);
        font-size: clamp(42px, 5.6vw, 96px);
        font-weight: 900;
        line-height: .9;
        letter-spacing: -.035em;
        text-wrap: balance;
        text-shadow: 0 5px 24px #000;
      }
      .slide.is-feature .name { font-size: clamp(38px, 4vw, 68px); }
      .role { margin-top: 16px; font-size: clamp(16px, 1.55vw, 27px); font-weight: 540; line-height: 1.18; color: rgba(255,255,255,.86); text-shadow: 0 3px 12px #000; }
      .credits-panel {
        position: absolute;
        inset: 0;
        z-index: 4;
        display: none;
        align-content: center;
        padding: clamp(48px, 6vw, 112px);
        overflow: hidden;
        background:
          radial-gradient(circle at 88% 12%, rgba(49,83,123,.42), transparent 35%),
          linear-gradient(145deg, #07101c, #111722 58%, #05070b);
      }
      .credits-panel::before {
        content: '';
        position: absolute;
        inset: 0;
        opacity: .14;
        background: url('assets/posters/moon.jpeg') 18% 34% / 150% auto no-repeat;
        filter: grayscale(1) contrast(1.15);
      }
      .slide.is-credits .portrait-bg,
      .slide.is-credits .portrait-main,
      .slide.is-credits .portrait-initials,
      .slide.is-credits .cast-label { display: none; }
      .slide.is-credits .credits-panel { display: grid; }
      .credits-content { position: relative; z-index: 1; }
      .credits-kicker { color: var(--amber); font-size: clamp(11px, .82vw, 14px); font-weight: 850; letter-spacing: .34em; text-transform: uppercase; }
      .credits-title {
        margin: 12px 0 clamp(26px, 4vh, 46px);
        font-family: var(--display);
        font-size: clamp(46px, 5.4vw, 92px);
        font-weight: 900;
        line-height: .92;
        letter-spacing: -.035em;
      }
      .credits-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(18px, 2.7vh, 32px) clamp(24px, 3vw, 52px); }
      .credit-group { min-width: 0; padding-left: 16px; border-left: 2px solid rgba(255,196,107,.72); }
      .credit-group.wide { grid-column: 1 / -1; }
      .credit-role { color: var(--amber); font-size: clamp(13px, 1.05vw, 18px); font-weight: 850; line-height: 1.15; }
      .credit-names { margin-top: 7px; color: rgba(255,255,255,.9); font-size: clamp(15px, 1.2vw, 21px); line-height: 1.35; text-wrap: balance; }
      .poster {
        position: relative;
        overflow: hidden;
        background: #02050a;
      }
      .poster::before {
        content: '';
        position: absolute;
        inset: -5%;
        z-index: 0;
        background: var(--poster-image) center / cover no-repeat;
        filter: blur(34px) brightness(.34) saturate(.82);
        transform: scale(1.12);
      }
      .poster::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        box-shadow: inset 0 0 80px rgba(0,0,0,.42);
      }
      .poster-image {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        filter: contrast(1.03) saturate(.96);
        animation: poster-breathe 10s ease-in-out both;
      }
      @keyframes poster-breathe { from { transform: scale(.992); } to { transform: scale(1.018); } }
      .controls {
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: max(18px, env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px;
        border: 1px solid rgba(255,255,255,.13);
        border-radius: 999px;
        background: rgba(8,8,8,.72);
        backdrop-filter: blur(16px);
        transform: translateX(-50%);
        transition: opacity .25s ease;
      }
      .controls button {
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 50%;
        color: #fff;
        background: transparent;
        cursor: pointer;
        transition: transform .28s cubic-bezier(.22,.9,.3,1.35), background-color .22s ease, color .22s ease;
      }
      .controls button:hover { background: rgba(255,255,255,.12); }
      .controls button:active { transform: scale(.9); transition-duration: .08s; }
      .controls button.active { color: #16100d; background: var(--orange); }
      .counter { min-width: 82px; text-align: center; color: rgba(255,255,255,.7); font-size: 12px; font-variant-numeric: tabular-nums; letter-spacing: .1em; }
      .topline { position: fixed; z-index: 30; top: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,.1); }
      .topline > i { display: block; width: 0; height: 100%; background: var(--orange); transition: width .45s ease; }
      .status { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #090909; color: rgba(255,255,255,.72); letter-spacing: .14em; text-transform: uppercase; }
      .status.hidden { display: none; }
      @media (max-width: 820px) {
        .slide { grid-template-columns: 1fr; grid-template-rows: 65% 35%; }
        .slide.reverse .portrait, .slide.reverse .poster { order: initial; }
        .poster-image { object-position: center; }
        .cast-label, .reverse .cast-label { left: 24px; right: 24px; bottom: 34px; text-align: left; }
        .name { font-size: clamp(40px, 12vw, 66px); }
        .slide.is-feature .name { font-size: clamp(36px, 10vw, 56px); }
        .credits-panel { padding: 28px 24px 46px; align-content: end; }
        .credits-title { margin: 7px 0 17px; font-size: clamp(34px, 10vw, 52px); }
        .credits-grid { gap: 12px 16px; }
        .credit-group { padding-left: 10px; }
        .credit-role { font-size: 11px; }
        .credit-names { margin-top: 3px; font-size: 12px; line-height: 1.25; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
        ::view-transition-old(cast-slide), ::view-transition-new(cast-slide) { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="app" aria-live="polite">
      <div class="status" id="status">Slideshow wird geladen …</div>
      <section class="slide" id="slide">
        <div class="portrait">
          <img class="portrait-bg" id="photoBg" alt="" />
          <img class="portrait-main" id="photo" alt="" />
          <div class="portrait-initials" id="portraitInitials" aria-hidden="true"></div>
          <div class="cast-label">
            <div class="eyebrow" id="eyebrow">Creepshow 2026 · Ensemble</div>
            <div class="name" id="person"></div>
            <div class="role" id="role"></div>
          </div>
          <div class="credits-panel" id="creditsPanel">
            <div class="credits-content">
              <div class="credits-kicker">Creepshow 2026 · Kreativteam</div>
              <div class="credits-title" id="creditsTitle"></div>
              <div class="credits-grid" id="creditsGrid"></div>
            </div>
          </div>
        </div>
        <div class="poster" id="poster" aria-hidden="true">
          <img class="poster-image" id="posterImage" alt="" />
        </div>
      </section>
      <div class="topline"><i id="progress"></i></div>
      <nav class="controls" aria-label="Slideshow-Steuerung">
        <button id="prev" aria-label="Vorherige Rolle">←</button>
        <button id="play" aria-label="Automatisch abspielen">▶</button>
        <span class="counter" id="counter">– / –</span>
        <button id="next" aria-label="Nächste Rolle">→</button>
        <button id="fullscreen" aria-label="Vollbild">⛶</button>
      </nav>
    </main>
    <script>
      const state = { slides: [], index: 0, timer: null, playing: false, renderToken: 0 };
      const $ = (id) => document.getElementById(id);
      const slide = $('slide');
      const photo = $('photo');
      const photoBg = $('photoBg');
      const eyebrow = $('eyebrow');
      const portraitInitials = $('portraitInitials');
      const poster = $('poster');
      const posterImage = $('posterImage');
      const creditsTitle = $('creditsTitle');
      const creditsGrid = $('creditsGrid');
      const posterFiles = ['assets/posters/moon.jpeg', 'assets/posters/castle.jpeg'];
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

      function imageSource(item) {
        if (item.type === 'cast') return `assets/cast/${item.selectedFile}`;
        if (item.type === 'feature') return item.image;
        return null;
      }

      function preload(index) {
        const item = state.slides[(index + state.slides.length) % state.slides.length];
        const src = item && imageSource(item);
        if (src) new Image().src = src;
      }

      function preloadImage(src) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = resolve;
          image.onerror = reject;
          image.src = src;
          if (image.complete && image.naturalWidth) resolve();
        });
      }

      function renderCredits(item) {
        creditsTitle.textContent = item.title;
        const groups = item.groups.map((group) => {
          const wrapper = document.createElement('section');
          wrapper.className = `credit-group${group.names.length > 6 ? ' wide' : ''}`;
          const role = document.createElement('div');
          role.className = 'credit-role';
          role.textContent = group.role;
          const names = document.createElement('div');
          names.className = 'credit-names';
          names.textContent = group.names.join(' · ');
          wrapper.append(role, names);
          return wrapper;
        });
        creditsGrid.replaceChildren(...groups);
      }

      function applySlide(index, item, direction) {
        state.index = index;
        const posterSrc = posterFiles[index % posterFiles.length];
        const isCredits = item.type === 'credits';
        slide.classList.toggle('reverse', index % 2 === 1);
        slide.classList.toggle('is-credits', isCredits);
        slide.classList.toggle('is-feature', item.type === 'feature');
        slide.classList.toggle('is-placeholder', Boolean(item.initials));
        poster.style.setProperty('--poster-image', `url('${posterSrc}')`);
        posterImage.src = posterSrc;
        if (isCredits) {
          renderCredits(item);
        } else {
          const src = imageSource(item);
          const isFeature = item.type === 'feature';
          photo.alt = item.initials ? `Offizieller Avatar-Platzhalter für ${item.person}` : `${item.person} · ${item.role}`;
          photo.src = src;
          photoBg.src = src;
          eyebrow.textContent = isFeature ? 'Creepshow 2026 · Technikteam' : 'Creepshow 2026 · Ensemble';
          portraitInitials.textContent = item.initials || '';
          $('person').textContent = item.person;
          $('role').textContent = item.role;
        }
        $('counter').textContent = `${String(index + 1).padStart(2, '0')} / ${String(state.slides.length).padStart(2, '0')}`;
        $('progress').style.width = `${((index + 1) / state.slides.length) * 100}%`;
        history.replaceState(null, '', `#${index + 1}`);
        slide.classList.add('ready');
        preload(index + direction);
      }

      async function render(index, direction = 1, animate = true) {
        if (!state.slides.length) return;
        const token = ++state.renderToken;
        const normalized = (index + state.slides.length) % state.slides.length;
        const item = state.slides[normalized];
        const src = imageSource(item);
        if (src) {
          try {
            await preloadImage(src);
          } catch {
            $('status').textContent = `Bild fehlt: ${src}`;
            $('status').classList.remove('hidden');
            return;
          }
        }
        if (token !== state.renderToken) return;
        const update = () => applySlide(normalized, item, direction);
        const canTransition = animate && slide.classList.contains('ready') && document.startViewTransition && !reduceMotion.matches;
        if (canTransition) {
          let applied = false;
          try {
            const transition = document.startViewTransition(() => { applied = true; update(); });
            await transition.finished;
          } catch {
            if (!applied) update();
          }
        } else {
          update();
        }
        if (token === state.renderToken && state.playing) schedule();
      }

      function schedule() {
        clearTimeout(state.timer);
        state.timer = setTimeout(() => render(state.index + 1, 1), 6500);
      }

      function togglePlay() {
        state.playing = !state.playing;
        $('play').textContent = state.playing ? 'Ⅱ' : '▶';
        $('play').classList.toggle('active', state.playing);
        if (state.playing) schedule(); else clearTimeout(state.timer);
      }

      $('prev').addEventListener('click', () => render(state.index - 1, -1));
      $('next').addEventListener('click', () => render(state.index + 1, 1));
      $('play').addEventListener('click', togglePlay);
      $('fullscreen').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowLeft') render(state.index - 1, -1);
        if (event.key === 'ArrowRight') render(state.index + 1, 1);
        if (event.key === ' ') { event.preventDefault(); togglePlay(); }
        if (event.key.toLowerCase() === 'f') $('fullscreen').click();
      });

      posterFiles.forEach((src) => { new Image().src = src; });

      Promise.all([fetch('cast-candidates.json'), fetch('creative-team.json'), fetch('technical-team.json')])
        .then(async ([castResponse, teamResponse, technicalResponse]) => {
          if (!castResponse.ok) throw new Error(castResponse.statusText);
          if (!teamResponse.ok) throw new Error(teamResponse.statusText);
          if (!technicalResponse.ok) throw new Error(technicalResponse.statusText);
          const cast = await castResponse.json();
          const creativeTeam = await teamResponse.json();
          const technicalTeam = await technicalResponse.json();
          const creativeSlides = creativeTeam.flatMap((item) => {
            const overview = { type: 'credits', ...item };
            if (item.title !== 'Technik') return [overview];
            return [overview, ...technicalTeam.map((member) => ({ type: 'feature', ...member }))];
          });
          state.slides = [
            ...Object.entries(cast).map(([person, value]) => ({ type: 'cast', person, ...value })),
            ...creativeSlides
          ];
          const requested = Number(location.hash.slice(1));
          await render(Number.isFinite(requested) && requested > 0 ? requested - 1 : 0, 1, false);
          $('status').classList.add('hidden');
        })
        .catch((error) => { $('status').textContent = `Daten konnten nicht geladen werden: ${error.message}`; });
    </script>
  </body>
</html>
